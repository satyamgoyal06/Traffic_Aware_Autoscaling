apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardscale-demo
  namespace: default
  labels:
    app: guardscale-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardscale-demo
  template:
    metadata:
      labels:
        app: guardscale-demo
    spec:
      containers:
        - name: web
          image: guardscale-demo:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WORK_ITERATIONS
              value: "12000"
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: guardscale-demo
  namespace: default
spec:
  type: NodePort
  selector:
    app: guardscale-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
