[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardscale"
version = "0.1.0"
description = "A research prototype for confidence-aware predictive autoscaling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
guardscale = "guardscale.cli:main"
guardscale-k8s = "guardscale.k8s_benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
